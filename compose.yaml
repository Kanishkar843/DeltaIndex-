services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: deltaindex
      POSTGRES_DB: deltaindex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ["db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deltaindex"]
      interval: 5s
      retries: 12
    mem_limit: 512m
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 12
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://deltaindex:${POSTGRES_PASSWORD}@db:5432/deltaindex
      REDIS_URL: redis://redis:6379/0
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN}
      EMBEDDING_MODE: fixture
    ports: ["127.0.0.1:${APP_PORT:-8001}:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      retries: 6
    mem_limit: 768m
volumes:
  db:
