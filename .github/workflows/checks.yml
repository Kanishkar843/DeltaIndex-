name: DeltaIndex acceptance
on: [push, pull_request]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: deltaindex
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: deltaindex
          POSTGRES_DB: deltaindex_test
          POSTGRES_PASSWORD: ${{ github.run_id }}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U deltaindex -d deltaindex_test"
          --health-interval 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: pip install -r requirements.lock
      - run: npm ci --prefix frontend
      - run: npm run typecheck --prefix frontend && npm run lint --prefix frontend && npm test --prefix frontend && npm run build --prefix frontend
      - run: python -m ruff check app tests integration --select E9,F63,F7,F82
      - run: python -m pytest -q tests
      - run: python -m pytest -q integration
        env:
          TEST_DATABASE_URL: postgresql+psycopg://deltaindex:${{ github.run_id }}@localhost:5432/deltaindex_test
          TEST_REDIS_URL: redis://localhost:6379/1
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_journey.py
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: docker compose build && docker compose up -d --wait && python tests/compose_acceptance.py
        env:
          POSTGRES_PASSWORD: ${{ github.run_id }}
          ADMIN_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}-local-ci
          ACCEPTANCE_URL: http://127.0.0.1:8001
      - if: always()
        run: docker compose down
        env:
          POSTGRES_PASSWORD: ${{ github.run_id }}
          ADMIN_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}-local-ci
